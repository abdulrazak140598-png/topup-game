<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topup Game</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}body{background:#0b122e;display:flex;justify-content:center}.app{width:100%;max-width:440px;background:#0f1a3d;min-height:100vh;overflow-x:hidden}.hdr{position:sticky;top:0;background:#0f1a3d;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e2a5a;z-index:10}.back{width:32px;height:32px;background:#18234f;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;cursor:pointer;text-decoration:none}.box{background:#172250;border:1px solid #24346a;border-radius:16px;padding:14px;margin:14px}.step{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:white;font-weight:700;font-size:13px}.step span{background:#ffcd00;color:black;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}input{width:100%;background:#0f1a3d;border:1px solid #24346a;border-radius:10px;padding:12px;color:white;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#0f1a3d;border:1px solid #24346a;border-radius:12px;padding:12px;cursor:pointer}.item.active{border-color:#ffcd00;background:#2a2400}.item .d{color:white;font-size:12px;font-weight:700}.item .p{color:#ffcd00;font-size:13px;font-weight:800;margin-top:4px}.buy{width:100%;background:#ccc;color:#666;padding:14px;border-radius:12px;text-align:center;font-weight:900;margin-top:12px;cursor:pointer}.buy.on{background:#ffcd00;color:black}.loc-item,.lang-item{display:flex;align-items:center;gap:12px;background:#2a2a2a;border:1px solid #333;padding:12px 14px;border-radius:12px;margin-bottom:8px;color:white;font-size:13px;cursor:pointer}.loc-item.active,.lang-item.active{border-color:#facc15;background:#2f2f1a}.loc-item img,.lang-item img{width:24px;height:24px;border-radius:50%;object-fit:cover}.check{margin-left:auto;color:#facc15}</style></head><body><div class="app"><div class="hdr"><a href="./" class="back">←</a><img id="gImg" style="width:40px;height:40px;border-radius:12px;background:#222"><div style="flex:1"><div id="gName" style="color:white;font-weight:800">Loading...</div><div style="color:#7a8bc0;font-size:11px">Fast • Aman</div></div><div id="curBtn" onclick="openLoc()" style="background:#18234f;border:1px solid #24346a;color:white;padding:6px 10px;border-radius:20px;font-size:11px;cursor:pointer">ID / IDR</div></div><div class="box"><div class="step"><span>1</span><span id="t1">Masukkan ID Akun</span></div><div style="display:flex;gap:10px"><input id="uid" placeholder="User ID"><input id="zid" placeholder="Zone ID"></div></div><div class="box"><div class="step"><span>2</span><span id="t2">Pilih Nominal</span></div><div id="list" class="grid"></div></div><div class="box"><div class="step"><span>3</span><span id="t3">Pembayaran</span></div><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="color:#7a8bc0;font-size:11px" id="tTotal">Total Bayar</div><div id="total" style="color:#ffcd00;font-weight:900;font-size:18px">Pilih nominal</div></div><div id="btn" onclick="beli()" class="buy">Beli</div></div></div></div><div id="locModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:end;justify-content:center"><div style="background:#1e1e1e;width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:20px"><div style="color:white;font-weight:700;margin-bottom:12px">Lokasi / Location</div><div onclick="setLoc('IDR')" class="loc-item active" data-cur="IDR"><img src="https://flagcdn.com/w40/id.png"><span>Indonesia (IDR)</span><span class="check">✓</span></div><div onclick="setLoc('MYR')" class="loc-item" data-cur="MYR"><img src="https://flagcdn.com/w40/my.png"><span>Malaysia (MYR)</span><span class="check"></span></div><div onclick="setLoc('PHP')" class="loc-item" data-cur="PHP"><img src="https://flagcdn.com/w40/ph.png"><span>Philippines (PHP)</span><span class="check"></span></div><div onclick="setLoc('SGD')" class="loc-item" data-cur="SGD"><img src="https://flagcdn.com/w40/sg.png"><span>Singapore (SGD)</span><span class="check"></span></div><div onclick="setLoc('THB')" class="loc-item" data-cur="THB"><img src="https://flagcdn.com/w40/th.png"><span>Thailand (THB)</span><span class="check"></span></div><div style="color:white;font-weight:700;margin:16px 0 12px">Bahasa / Language</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div onclick="setLang('ID')" id="langID" class="lang-item active"><img src="https://flagcdn.com/w40/id.png"><span>ID</span><span class="check">✓</span></div><div onclick="setLang('EN')" id="langEN" class="lang-item"><img src="https://flagcdn.com/w40/gb.png"><span>EN</span><span class="check"></span></div></div><div onclick="closeLoc()" style="background:#2a2a2a;color:white;text-align:center;padding:12px;border-radius:12px;margin-top:16px;cursor:pointer">Tutup / Close</div></div></div><script>
const gamesData={
'Mobile Legends':{img:'mlbb.png',prices:[{d:'86 Diamond',p:20000},{d:'172 Diamond',p:39000},{d:'257 Diamond',p:58000},{d:'344 Diamond',p:77000},{d:'514 Diamond',p:115000}]},
'Free Fire':{img:'ff.png',prices:[{d:'70 Diamond',p:10000},{d:'140 Diamond',p:20000},{d:'355 Diamond',p:50000}]},
'PUBG Mobile':{img:'pubg.png',prices:[{d:'60 UC',p:14000},{d:'325 UC',p:70000}]},
'Valorant':{img:'valorant.png',prices:[{d:'125 VP',p:15000},{d:'420 VP',p:50000}]},
'ROBLOX':{img:'roblox.png',prices:[{d:'80 Robux',p:12000}]},
'Genshin Impact':{img:'genshin.png',prices:[{d:'300 Genesis',p:65000}]},
'Honkai Star Rail':{img:'honkai.png',prices:[{d:'300 Jade',p:65000}]},
'Clash of Clans':{img:'coc.png',prices:[{d:'500 Gems',p:70000}]},
'Call of Duty Mobile':{img:'codm.png',prices:[{d:'80 CP',p:15000}]},
};
const rates={IDR:{sym:'Rp ',rate:1},MYR:{sym:'RM ',rate:0.00029},PHP:{sym:'₱ ',rate:0.0036},SGD:{sym:'S$ ',rate:0.000086},THB:{sym:'฿ ',rate:0.0023}};
let sel=null,curGame=null,cur='IDR',lang='ID';
function init(){
 let name=new URLSearchParams(location.search).get('game');
 if(!name||!gamesData[name])return;
 curGame=name;let g=gamesData[name];
 document.getElementById('gName').innerText=name;
 document.getElementById('gImg').src=g.img;
 renderPrices();
}
function renderPrices(){
 let g=gamesData[curGame];let list=document.getElementById('list');list.innerHTML='';
 g.prices.forEach((it,i)=>{
   let price=it.p*rates[cur].rate;
   let txt=cur==='IDR'?'Rp '+it.p.toLocaleString('id-ID'):rates[cur].sym+price.toFixed(cur==='MYR'||cur==='SGD'?2:0);
   list.innerHTML+=`<div onclick="pilih(${i})" id="it${i}" class="item"><div class="d">${it.d}</div><div class="p">${txt}</div></div>`;
 });
 if(sel){
   let price=sel.p*rates[cur].rate;
   document.getElementById('total').innerText=cur==='IDR'?'Rp '+sel.p.toLocaleString('id-ID'):rates[cur].sym+price.toFixed(cur==='MYR'||cur==='SGD'?2:0);
 }
}
function pilih(i){sel=gamesData[curGame].prices[i];document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));document.getElementById('it'+i).classList.add('active');let price=sel.p*rates[cur].rate;document.getElementById('total').innerText=cur==='IDR'?'Rp '+sel.p.toLocaleString('id-ID'):rates[cur].sym+price.toFixed(2);document.getElementById('btn').classList.add('on');}
function beli(){if(!sel)return alert(lang==='ID'?'Pilih diamond dulu!':'Select diamond first!');let u=document.getElementById('uid').value;if(!u)return alert('Isi User ID!');let z=document.getElementById('zid').value;let price=cur==='IDR'?'Rp '+sel.p.toLocaleString('id-ID'):rates[cur].sym+(sel.p*rates[cur].rate).toFixed(2);let txt=`Halo kak mau topup%0AGame: ${curGame}%0AID: ${u} (${z})%0AItem: ${sel.d}%0AHarga: ${price} (${cur})`;window.open(`https://wa.me/6282353459352?text=${txt}`,'_blank');}
function openLoc(){document.getElementById('locModal').style.display='flex'}function closeLoc(){document.getElementById('locModal').style.display='none'}
function setLoc(c){
 cur=c;
 document.getElementById('curBtn').innerText=c+' / '+c;
 document.querySelectorAll('.loc-item').forEach(el=>{el.classList.remove('active');el.querySelector('.check').innerText='';});
 let a=document.querySelector(`[data-cur="${c}"]`);a.classList.add('active');a.querySelector('.check').innerText='✓';
 renderPrices(); closeLoc();
}
function setLang(l){
 lang=l;
 document.querySelectorAll('.lang-item').forEach(el=>el.classList.remove('active'));
 document.querySelectorAll('.lang-item .check').forEach(el=>el.innerText='');
 document.getElementById('lang'+l).classList.add('active');
 document.getElementById('lang'+l).querySelector('.check').innerText='✓';
 if(l==='EN'){document.getElementById('t1').innerText='Enter Account ID';document.getElementById('t2').innerText='Select Amount';document.getElementById('t3').innerText='Payment';document.getElementById('tTotal').innerText='Total';document.getElementById('btn').innerText='Buy Now';}
 else{document.getElementById('t1').innerText='Masukkan ID Akun';document.getElementById('t2').innerText='Pilih Nominal';document.getElementById('t3').innerText='Pembayaran';document.getElementById('tTotal').innerText='Total Bayar';document.getElementById('btn').innerText='Beli';}
}
document.getElementById('locModal').addEventListener('click',e=>{if(e.target.id==='locModal')closeLoc();});
init();
</script></body></html>
