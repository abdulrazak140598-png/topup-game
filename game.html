<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topup Game</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}body{background:#0b122e;display:flex;justify-content:center}.app{width:100%;max-width:440px;background:#0f1a3d;min-height:100vh}.hdr{position:sticky;top:0;background:#0f1a3d;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e2a5a;z-index:10}.back{width:32px;height:32px;background:#18234f;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;cursor:pointer;text-decoration:none}.box{background:#172250;border:1px solid #24346a;border-radius:16px;padding:14px;margin:14px}.step{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:white;font-weight:700;font-size:13px}.step span{background:#ffcd00;color:black;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}input{width:100%;background:#0f1a3d;border:1px solid #24346a;border-radius:10px;padding:12px;color:white;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#0f1a3d;border:1px solid #24346a;border-radius:12px;padding:12px;cursor:pointer}.item.active{border-color:#ffcd00;background:#2a2400}.item .d{color:white;font-size:12px;font-weight:700}.item .p{color:#ffcd00;font-size:13px;font-weight:800;margin-top:4px}.buy{width:100%;background:#ccc;color:#666;padding:14px;border-radius:12px;text-align:center;font-weight:900;margin-top:12px;cursor:pointer}.buy.on{background:#ffcd00;color:black}</style></head><body><div class="app"><div class="hdr"><a href="./" class="back">←</a><img id="gImg" style="width:40px;height:40px;border-radius:12px;background:#222"><div><div id="gName" style="color:white;font-weight:800">Loading...</div><div style="color:#7a8bc0;font-size:11px">Fast • Aman • 1 Detik</div></div></div><div id="content" style="padding-bottom:80px"><div class="box"><div class="step"><span>1</span> Masukkan ID Akun</div><div style="display:flex;gap:10px"><input id="uid" placeholder="User ID"><input id="zid" placeholder="Zone ID (opsional)"></div><div style="color:#7a8bc0;font-size:10px;margin-top:8px">Contoh MLBB: 12345678 (1234) - lihat di profil game</div></div><div class="box"><div class="step"><span>2</span> Pilih Nominal</div><div id="list" class="grid"></div></div><div class="box"><div class="step"><span>3</span> Bayar</div><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="color:#7a8bc0;font-size:11px">Total Bayar</div><div id="total" style="color:#ffcd00;font-weight:900;font-size:18px">Pilih nominal</div></div><div id="btn" onclick="beli()" class="buy">Beli Sekarang</div></div></div><div style="margin:14px;background:#1a2a1a;border:1px solid #2a5a2a;border-radius:12px;padding:12px;color:#8f8;font-size:11px">✓ Proses otomatis 1-3 menit • ✓ Garansi 100% • ✓ CS 24 Jam via WA 082353459352</div></div></div><script>
const gamesData={
'Mobile Legends':{img:'./mlbb.png',prices:[{d:'86 Diamond',p:20000},{d:'172 Diamond',p:39000},{d:'257 Diamond',p:58000},{d:'344 Diamond',p:77000},{d:'514 Diamond',p:115000},{d:'706 Diamond',p:155000},{d:'875 Diamond',p:195000},{d:'1049 Diamond',p:235000}]},
'Free Fire':{img:'./ff.png',prices:[{d:'70 Diamond',p:10000},{d:'140 Diamond',p:20000},{d:'355 Diamond',p:50000},{d:'720 Diamond',p:100000}]},
'PUBG Mobile':{img:'./pubg.png',prices:[{d:'60 UC',p:14000},{d:'325 UC',p:70000},{d:'660 UC',p:140000}]},
'Valorant':{img:'./valorant.png',prices:[{d:'125 VP',p:15000},{d:'420 VP',p:50000},{d:'700 VP',p:80000}]},
'ROBLOX':{img:'./roblox.png',prices:[{d:'80 Robux',p:12000},{d:'400 Robux',p:60000}]},
'Genshin Impact':{img:'./genshin.png',prices:[{d:'300 Genesis',p:65000}]},
'Honkai Star Rail':{img:'./honkai.png',prices:[{d:'300 Jade',p:65000}]},
'Clash of Clans':{img:'./coc.png',prices:[{d:'500 Gems',p:70000}]},
'CODM':{img:'./codm.png',prices:[{d:'80 CP',p:15000}]},
};
let sel=null, curGame=null;
function init(){
 let name=new URLSearchParams(location.search).get('game');
 if(!name||!gamesData[name]){document.getElementById('gName').innerText='Game tidak ditemukan';return;}
 curGame=name;
 let g=gamesData[name];
 document.getElementById('gName').innerText=name;
 document.getElementById('gImg').src=g.img;
 document.title=name+' - Topup Murah';
 let list=document.getElementById('list'); list.innerHTML='';
 g.prices.forEach((it,i)=>{
   list.innerHTML+=`<div onclick="pilih(${i})" id="it${i}" class="item"><div class="d">${it.d}</div><div class="p">Rp ${it.p.toLocaleString('id-ID')}</div></div>`;
 });
}
function pilih(i){
 sel=gamesData[curGame].prices[i];
 document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
 document.getElementById('it'+i).classList.add('active');
 document.getElementById('total').innerText='Rp '+sel.p.toLocaleString('id-ID');
 let b=document.getElementById('btn'); b.classList.add('on');
}
function beli(){
 if(!sel) return alert('Pilih diamond dulu!');
 let u=document.getElementById('uid').value; if(!u) return alert('Isi User ID!');
 let z=document.getElementById('zid').value;
 let txt=`Halo kak mau topup%0A%0AGame: ${curGame}%0AID: ${u} (${z})%0AItem: ${sel.d}%0AHarga: Rp ${sel.p.toLocaleString('id-ID')}%0A%0AMohon diproses ya kak 🙏`;
 window.open(`https://wa.me/6282353459352?text=${txt}`,'_blank');
}
init();
</script></body></html>
