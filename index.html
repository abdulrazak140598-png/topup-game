<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPUP GAME</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0a1028;color:white;font-family:system-ui}
.card{background:#151d3a;border:1px solid #223054;border-radius:16px;overflow:hidden}
</style>
</head>
<body>
<header style="background:#0e162f;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #223054;position:sticky;top:0">
  <div style="display:flex;align-items:center;gap:8px">
    <img src="logo.png" style="width:28px;height:28px;object-fit:contain;border-radius:6px">
    <b>TOPUP GAME</b>
  </div>
  <div style="background:#1a2348;padding:6px 12px;border-radius:20px;font-size:11px">EN / MYR</div>
</header>

<div style="padding:16px">
  <div style="background:linear-gradient(90deg,#dc2626,#f97316);border-radius:16px;padding:20px;font-weight:900">FREE FIRE SALE<br><span style="font-size:11px;font-weight:400">Diamond Murah</span></div>
  <input id="search" oninput="doFilter()" placeholder="Search Game or Voucher" style="width:100%;margin-top:16px;background:#1a2348;border:1px solid #223054;border-radius:12px;padding:10px 16px;color:white;outline:none">
  <div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px"></div>
</div>

<script>
const games=[
{n:'Mobile Legends', img:'https://upload.wikimedia.org/wikipedia/commons/e/e0/Mobile_Legends_Bang_Bang_logo.png', bg:'#1e40af'},
{n:'Free Fire', img:'https://upload.wikimedia.org/wikipedia/commons/7/7a/Garena_Free_Fire_logo.png', bg:'#111827'},
{n:'PUBG Mobile', img:'https://upload.wikimedia.org/wikipedia/commons/5/5a/PUBG_MOBILE_logo.png', bg:'#a16207'},
{n:'Valorant', img:'https://upload.wikimedia.org/wikipedia/commons/f/fc/Valorant_logo_-_black_color_version.svg', bg:'#7f1d1d'},
{n:'ROBLOX', img:'https://upload.wikimedia.org/wikipedia/commons/c/ce/Roblox_logo.svg', bg:'#334155'},
{n:'Genshin Impact', img:'https://upload.wikimedia.org/wikipedia/commons/7/77/Genshin_Impact_logo.svg', bg:'#1e3a8a'},
{n:'Honkai Star Rail', img:'https://upload.wikimedia.org/wikipedia/commons/b/b6/Honkai_Star_Rail_logo.png', bg:'#4c1d95'},
{n:'Clash of Clans', img:'https://upload.wikimedia.org/wikipedia/commons/b/b7/Clash_of_Clans_logo.png', bg:'#854d0e'},
];

function render(list){
  let g=document.getElementById('grid');g.innerHTML='';
  list.forEach(x=>{
    g.innerHTML+=`<div class="card">
      <div style="background:${x.bg};height:110px;display:flex;align-items:center;justify-content:center">
        <img src="${x.img}" style="width:60px;height:60px;object-fit:contain;background:white;border-radius:14px;padding:6px">
      </div>
      <div style="padding:10px;text-align:center;font-size:11px;font-weight:800">${x.n}</div>
    </div>`;
  });
}
function doFilter(){
  let q=document.getElementById('search').value.toLowerCase();
  render(games.filter(x=>x.n.toLowerCase().includes(q)));
}
render(games);
</script>
</body>
</html>
