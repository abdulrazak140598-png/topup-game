<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TG TOPUP - Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body{background:#0e162f;color:white;font-family:Inter,sans-serif}
.card{background:#162040;border:1px solid #223054;border-radius:14px;overflow:hidden}
.banner{height:95px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-direction:column;gap:4px}
.nom{border:1px solid #223054;background:#162040;padding:10px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.nom.active{border-color:#facc15;background:#facc1522;color:#facc15}
.pay{border:1px solid #223054;background:#162040;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pay.active{border-color:#facc15;background:#1e2a4a}
</style>
</head>
<body class="max-w-[480px] mx-auto min-h-screen">

<!-- HEADER -->
<header class="sticky top-0 z-20 bg-[#0e162f] px-4 py-3 flex justify-between border-b border-[#223054]">
<div class="flex gap-3 items-center"><i class="fa-solid fa-bars"></i><div class="font-black text-lg"><span class="bg-yellow-400 text-black px-2.5 py-1 rounded-lg">TG</span> TOPUP GAME</div></div>
<div class="bg-[#1e1e1e] border border-[#333] px-3 py-1.5 rounded-full text-[11px] font-bold">🇲🇾 EN / MYR</div>
</header>

<!-- HOME -->
<div id="home">
<div class="px-4 mt-4"><div class="bg-[#162040] rounded-xl p-3 flex items-center border border-[#223054]"><i class="fa-solid fa-magnifying-glass text-zinc-500"></i><input id="s" onkeyup="filterG()" placeholder="Cari Mobile Legends, Free Fire..." class="bg-transparent outline-none ml-3 w-full text-sm"></div></div>
<div class="px-4 mt-5"><h2 class="font-black text-[13px] tracking-widest">POPULER 🔥</h2><div id="grid" class="grid grid-cols-2 gap-2.5 mt-3"></div></div>
<div class="px-4 mt-6 pb-10 text-[11px] text-zinc-500 text-center">AI Coding by Meta AI - 100% Work No Blokir Gambar</div>
</div>

<!-- DETAIL PAGE -->
<div id="detail" class="hidden fixed inset-0 bg-[#0e162f] z-30 overflow-auto">
<div class="max-w-[480px] mx-auto">
<div class="p-4 flex items-center gap-3 border-b border-[#223054] sticky top-0 bg-[#0e162f]"><button onclick="backHome()" class="w-8 h-8 bg-[#162040] rounded-full"><i class="fa-solid fa-arrow-left"></i></button><div id="dTitle" class="font-black">Mobile Legends</div></div>
<div id="dBanner" class="banner text-lg"></div>
<div class="p-4 space-y-5 pb-20">
<div><div class="font-bold text-sm mb-2">1. Masukkan Data Akun</div><div class="grid grid-cols-2 gap-2"><input id="uid" placeholder="User ID" class="bg-[#162040] border border-[#223054] p-3 rounded-xl text-sm outline-none"><input id="server" placeholder="Server (1234)" class="bg-[#162040] border border-[#223054] p-3 rounded-xl text-sm outline-none"></div></div>
<div><div class="font-bold text-sm mb-2">2. Pilih Nominal</div><div id="dNom" class="grid grid-cols-2 gap-2"></div></div>
<div><div class="font-bold text-sm mb-2">3. Metode Pembayaran</div><div class="space-y-2"><div onclick="setPay(this,'QRIS')" class="pay active"><span><i class="fa-solid fa-qrcode mr-2"></i> QRIS (All E-Wallet)</span><i class="fa-solid fa-check text-yellow-400"></i></div><div onclick="setPay(this,'DANA')" class="pay"><span>💙 DANA</span><span class="text-xs text-zinc-400">Auto</span></div><div onclick="setPay(this,'OVO')" class="pay"><span>💜 OVO</span><span class="text-xs text-zinc-400">Auto</span></div></div></div>
<div class="bg-[#162040] border border-[#223054] p-3 rounded-xl flex justify-between text-sm"><span>Total Bayar</span><span id="dTotal" class="font-black text-yellow-400">RM 0.00</span></div>
<button onclick="bayar()" class="w-full bg-yellow-400 text-black font-black py-4 rounded-xl">BAYAR SEKARANG</button>
</div>
</div>
</div>

<script>
const games=[
{n:'Mobile Legends',c:'linear-gradient(135deg,#1e40af,#60a5fa)',icon:'fa-shield-halved',noms:[{l:'86 Diamond',p:1.5},{l:'172 Diamond',p:3},{l:'344 Diamond',p:6},{l:'720 Diamond',p:12}]},
{n:'Free Fire',c:'linear-gradient(135deg,#000,#facc15)',icon:'fa-fire',noms:[{l:'70 Diamond',p:1},{l:'140 Diamond',p:2},{l:'355 Diamond',p:5},{l:'720 Diamond',p:10}]},
{n:'PUBG Mobile',c:'linear-gradient(135deg,#a16207,#fbbf24)',icon:'fa-crosshairs',noms:[{l:'60 UC',p:1},{l:'325 UC',p:5},{l:'660 UC',p:10},{l:'1800 UC',p:25}]},
{n:'Valorant',c:'linear-gradient(135deg,#7f1d1d,#ef4444)',icon:'fa-burst',noms:[{l:'125 VP',p:2},{l:'420 VP',p:5},{l:'700 VP',p:9},{l:'1375 VP',p:17}]},
{n:'ROBLOX',c:'linear-gradient(135deg,#111,#9ca3af)',icon:'fa-cube',noms:[{l:'80 Robux',p:1.5},{l:'400 Robux',p:6},{l:'800 Robux',p:12},{l:'1700 Robux',p:24}]},
{n:'Genshin Impact',c:'linear-gradient(135deg,#1e3a8a,#38bdf8)',icon:'fa-wind',noms:[{l:'60 Crystal',p:2},{l:'300 Crystal',p:7},{l:'980 Crystal',p:20},{l:'1980 Crystal',p:40}]},
];

let selGame=null, selNom=null, selPay='QRIS';
let filtered=[...games];

function renderGrid(){
let g=document.getElementById('grid');g.innerHTML='';
filtered.forEach((x,i)=>{
g.innerHTML+=`<div onclick="openGame(${games.indexOf(x)})" class="card"><div class="banner" style="background:${x.c}"><i class="fa-solid ${x.icon} text-2xl"></i><span class="text-[11px] mt-1">${x.n}</span></div><div class="p-2.5"><div class="text-[11px] font-bold truncate">${x.n}</div><div class="text-yellow-400 font-black text-[11px] mt-1">Mulai RM ${x.noms[0].p}</div></div></div>`;
});
}
function openGame(i){
selGame=games[i];selNom=selGame.noms[0];
document.getElementById('dTitle').innerText=selGame.n.n;
document.getElementById('dBanner').style.background=selGame.c;
document.getElementById('dBanner').innerHTML=`<i class="fa-solid ${selGame.icon} text-3xl"></i><div>${selGame.n}</div>`;
let nBox=document.getElementById('dNom');nBox.innerHTML='';
selGame.noms.forEach((n,idx)=>{
nBox.innerHTML+=`<div onclick="setNom(this,${idx})" class="nom ${idx==0?'active':''}"><div>${n.l}</div><div class="text-yellow-400">RM ${n.p}</div></div>`;
});
document.getElementById('dTotal').innerText='RM '+selNom.p.toFixed(2);
document.getElementById('home').classList.add('hidden');
document.getElementById('detail').classList.remove('hidden');
window.scrollTo(0,0);
}
function backHome(){document.getElementById('detail').classList.add('hidden');document.getElementById('home').classList.remove('hidden');}
function setNom(el,idx){document.querySelectorAll('.nom').forEach(e=>e.classList.remove('active'));el.classList.add('active');selNom=selGame.noms[idx];document.getElementById('dTotal').innerText='RM '+selNom.p.toFixed(2);}
function setPay(el,m){document.querySelectorAll('.pay').forEach(e=>e.classList.remove('active'));el.classList.add('active');selPay=m;}
function bayar(){
let id=document.getElementById('uid').value;
if(!id){alert('Isi User ID dulu bang!');return;}
alert(`SUKSES!\nGame: ${selGame.n}\nID: ${id}\nNominal: ${selNom.l}\nTotal: RM ${selNom.p}\nBayar via: ${selPay}\n\nIni demo store AI bang, tinggal sambungin ke API Digiflazz / VIP-Reseller buat jadi real!`);
backHome();
}
function filterG(){let q=document.getElementById('s').value.toLowerCase();filtered=games.filter(x=>x.n.toLowerCase().includes(q));renderGrid();}
renderGrid();
</script>
</body>
</html>
