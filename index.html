<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPUP GAME - Logo Version</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body{background:#0e162f;color:white;font-family:Inter,sans-serif}
.card{background:#162040;border:1px solid #223054;border-radius:14px;overflow:hidden;cursor:pointer}
.game-banner{height:105px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.game-banner img{width:100%;height:100%;object-fit:cover}
.game-logo{width:56px;height:56px;border-radius:14px;background:white;padding:6px;object-fit:contain;position:absolute;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
.flag{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid #444}
.flag-sm{width:16px;height:16px;border-radius:50%;object-fit:cover}
.shop-logo{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#facc15;display:flex;align-items:center;justify-content:center;font-weight:900;color:black}
.loc-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.loc-box{background:#232323;border-radius:20px;width:100%;max-width:380px;padding:20px;border:1px solid #333}
.loc-item{background:#2e2e2e;border:1px solid #3a3a3a;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer}
.loc-item.active{border-color:#E5C07B;background:#3a352a}
.lang-item{background:#2e2e2e;border:1px solid #3a3a3a;border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;flex:1}
.lang-item.active{border-color:#E5C07B}
.banner-slider{overflow:hidden;border-radius:16px;position:relative;height:130px}
.banner-track{display:flex;transition:transform 0.5s ease;width:300%}
.banner-slide{width:33.333%;height:130px;flex-shrink:0;display:flex;align-items:center;padding:20px;justify-content:space-between}
#sideBar{position:fixed;top:0;right:0;width:80%;max-width:300px;height:100%;background:#162040;z-index:90;padding:20px;transform:translateX(100%);transition:0.3s;border-left:1px solid #223054}
#sideBar.open{transform:translateX(0)}
</style>
</head>
<body class="max-w-[480px] mx-auto min-h-screen relative">

<!-- HEADER - LOGO TOKO DI SINI -->
<header class="sticky top-0 z-20 bg-[#0e162f] px-4 py-3 flex justify-between items-center border-b border-[#223054]">
  <div class="flex items-center gap-2.5">
    <!-- GANTI logo.png DENGAN LOGO TOKO ABANG - UPLOAD KE GITHUB -->
    <img src="logo.png" onerror="this.style.display='none';document.getElementById('fallbackLogo').style.display='flex'" class="w-[34px] h-[34px] rounded-lg object-cover">
    <div id="fallbackLogo" class="shop-logo">TG</div>
    <div class="font-black text-[15px]">TOPUP GAME</div>
  </div>
  <div class="flex items-center gap-2">
    <button onclick="openLoc()" class="bg-[#1e1e1e] border border-[#333] px-3 py-1.5 rounded-full text-[11px] font-bold flex items-center gap-1.5">
      <img id="topFlagImg" class="flag-sm" src="https://flagcdn.com/w40/my.png"><span id="topLang">EN</span>/<span id="topCurr">MYR</span>
    </button>
    <button onclick="openSide()" class="w-9 h-9 flex items-center justify-center"><i class="fa-solid fa-bars text-[20px]"></i></button>
  </div>
</header>

<div class="px-4 mt-4">
  <div class="banner-slider border border-[#223054]">
    <div id="track" class="banner-track">
      <div class="banner-slide" style="background:linear-gradient(135deg,#7c3aed,#facc15)"><div><div class="font-black text-lg">BONUS 100% 🔥</div><div class="text-xs">Topup ML Hari Ini</div></div><i class="fa-solid fa-gift text-4xl"></i></div>
      <div class="banner-slide" style="background:linear-gradient(135deg,#dc2626,#f97316)"><div><div class="font-black text-lg">FREE FIRE SALE</div><div class="text-xs">Diamond Murah RM 0.50</div></div><i class="fa-solid fa-fire text-4xl"></i></div>
      <div class="banner-slide" style="background:linear-gradient(135deg,#0e7490,#22d3ee)"><div><div class="font-black text-lg">ROBLOX ROBUX</div><div class="text-xs">Instant Delivery</div></div><i class="fa-solid fa-cube text-4xl"></i></div>
    </div>
  </div>
</div>

<div class="px-4 mt-4"><div class="bg-[#162040] rounded-xl p-3 flex items-center border border-[#223054]"><i class="fa-solid fa-magnifying-glass text-zinc-500"></i><input id="s" onkeyup="filterG()" placeholder="Search Game" class="bg-transparent outline-none ml-3 w-full text-sm"></div></div>

<div class="px-4 mt-5 pb-10">
<h2 class="font-black text-[13px] tracking-widest">POPULER 🔥</h2>
<div id="grid" class="grid grid-cols-2 gap-2.5 mt-3"></div>
</div>

<!-- SIDEBAR & MODAL SAMA -->
<div id="sideBg" onclick="closeSide()" class="fixed inset-0 bg-black/60 z-[80] hidden"></div>
<div id="sideBar"><div class="flex justify-between"><div class="font-black">MENU</div><button onclick="closeSide()"><i class="fa-solid fa-xmark"></i></button></div></div>

<div id="locModal" class="loc-modal-bg hidden"><div class="loc-box">
<div class="flex justify-between items-center mb-5"><h3 class="font-bold">Location</h3><button onclick="closeLoc()"><i class="fa-solid fa-xmark"></i></button></div>
<div id="listLocation">
<div onclick="setLoc('IDR','id')" data-curr="IDR" class="loc-item"><div class="flex items-center gap-3"><img class="flag" src="https://flagcdn.com/w40/id.png"> Indonesia (IDR)</div><i class="fa-solid fa-check check hidden text-[#E5C07B]"></i></div>
<div onclick="setLoc('MYR','my')" data-curr="MYR" class="loc-item active"><div class="flex items-center gap-3"><img class="flag" src="https://flagcdn.com/w40/my.png"> Malaysia (MYR)</div><i class="fa-solid fa-check check text-[#E5C07B]"></i></div>
<div onclick="setLoc('PHP','ph')" data-curr="PHP" class="loc-item"><div class="flex items-center gap-3"><img class="flag" src="https://flagcdn.com/w40/ph.png"> Philippines (PHP)</div><i class="fa-solid fa-check check hidden"></i></div>
<div onclick="setLoc('SGD','sg')" data-curr="SGD" class="loc-item"><div class="flex items-center gap-3"><img class="flag" src="https://flagcdn.com/w40/sg.png"> Singapore (SGD)</div><i class="fa-solid fa-check check hidden"></i></div>
<div onclick="setLoc('THB','th')" data-curr="THB" class="loc-item"><div class="flex items-center gap-3"><img class="flag" src="https://flagcdn.com/w40/th.png"> Thailand (THB)</div><i class="fa-solid fa-check check hidden"></i></div>
</div>
<div class="mt-6"><h3 class="font-bold mb-3">Language</h3><div class="flex gap-3"><div onclick="setLang('ID')" data-lang="ID" class="lang-item"><div class="flex items-center gap-2"><img class="flag" src="https://flagcdn.com/w40/id.png"> ID</div><i class="fa-solid fa-check check hidden"></i></div><div onclick="setLang('EN')" data-lang="EN" class="lang-item active"><div class="flex items-center gap-2"><img class="flag" src="https://flagcdn.com/w40/gb.png"> EN</div><i class="fa-solid fa-check check text-[#E5C07B]"></i></div></div></div>
</div></div>

<script>
let curr='MYR', idx=0;
const rates={IDR:1,MYR:3500,PHP:280,SGD:12000,THB:450};

// LOGO GAME ASLI - PAKAI WIKIMEDIA (GRATIS & ANTI BLOKIR)
const games=[
{n:'Mobile Legends', banner:'linear-gradient(135deg,#1e40af,#60a5fa)', logo:'https://upload.wikimedia.org/wikipedia/commons/8/82/Mobile_Legends_logo.png', base:5000},
{n:'Free Fire', banner:'linear-gradient(135deg,#111,#facc15)', logo:'https://upload.wikimedia.org/wikipedia/commons/7/7a/Garena_Free_Fire_logo.png', base:1000},
{n:'PUBG Mobile', banner:'linear-gradient(135deg,#a16207,#fbbf24)', logo:'https://upload.wikimedia.org/wikipedia/commons/5/5a/PUBG_MOBILE_logo.png', base:7000},
{n:'Valorant', banner:'linear-gradient(135deg,#7f1d1d,#ef4444)', logo:'https://upload.wikimedia.org/wikipedia/commons/f/fc/Valorant_logo_-_black_color_version.svg', base:10000},
{n:'ROBLOX', banner:'linear-gradient(135deg,#111,#555)', logo:'https://upload.wikimedia.org/wikipedia/commons/c/ce/Roblox_logo.svg', base:12000},
{n:'Genshin Impact', banner:'linear-gradient(135deg,#1e3a8a,#38bdf8)', logo:'https://upload.wikimedia.org/wikipedia/commons/7/77/Genshin_Impact_logo.svg', base:15000},
{n:'Clash of Clans', banner:'linear-gradient(135deg,#854d0e,#eab308)', logo:'https://upload.wikimedia.org/wikipedia/commons/b/b7/Clash_of_Clans_logo.png', base:8000},
{n:'Honor of Kings', banner:'linear-gradient(135deg,#ca8a04,#fde047)', logo:'https://upload.wikimedia.org/wikipedia/commons/2/26/Honor_of_Kings_logo.png', base:6000},
];

let filtered=[...games];
function openSide(){document.getElementById('sideBar').classList.add('open');document.getElementById('sideBg').classList.remove('hidden')}
function closeSide(){document.getElementById('sideBar').classList.remove('open');document.getElementById('sideBg').classList.add('hidden')}
function openLoc(){document.getElementById('locModal').classList.remove('hidden')}function closeLoc(){document.getElementById('locModal').classList.add('hidden')}
function setLoc(code, flagCode){curr=code;document.querySelectorAll('#listLocation .loc-item').forEach(e=>{e.classList.remove('active');e.querySelector('.check').classList.add('hidden')});let el=document.querySelector(`#listLocation .loc-item[data-curr="${code}"]`);el.classList.add('active');el.querySelector('.check').classList.remove('hidden');document.getElementById('topCurr').innerText=code;document.getElementById('topFlagImg').src=`https://flagcdn.com/w40/${flagCode}.png`;renderGrid();closeLoc();}
function setLang(l){document.querySelectorAll('.lang-item').forEach(e=>{e.classList.remove('active');e.querySelector('.check').classList.add('hidden')});let el=document.querySelector(`.lang-item[data-lang="${l}"]`);el.classList.add('active');el.querySelector('.check').classList.remove('hidden');document.getElementById('topLang').innerText=l;}
function format(p){if(curr==='IDR') return 'Rp '+p.toLocaleString('id-ID');if(curr==='MYR') return 'RM '+(p/rates.MYR).toFixed(2);if(curr==='PHP') return '₱ '+(p/rates.PHP).toFixed(0);if(curr==='SGD') return 'S$ '+(p/rates.SGD).toFixed(2);return '฿ '+(p/rates.THB).toFixed(0);}
function renderGrid(){
  let g=document.getElementById('grid');g.innerHTML='';
  filtered.forEach(x=>{
    g.innerHTML+=`<div class="card"><div class="game-banner" style="background:${x.banner}"><img src="${x.logo}" class="game-logo" onerror="this.src='https://via.placeholder.com/56?text=${x.n[0]}'"></div><div class="p-2.5"><div class="text-[11px] font-bold truncate">${x.n}</div><div class="text-yellow-400 font-black text-[11px] mt-1">${format(x.base)}</div></div></div>`;
  });
}
function filterG(){let q=document.getElementById('s').value.toLowerCase();filtered=games.filter(x=>x.n.toLowerCase().includes(q));renderGrid();}
setInterval(()=>{idx=(idx+1)%3;document.getElementById('track').style.transform=`translateX(-${idx*33.333}%)`},3000);
renderGrid();
</script>
</body>
</html>
