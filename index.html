<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPUP GAME</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0e1738;color:white;font-family:system-ui} .card{background:#19244a;border-radius:16px;overflow:hidden;border:1px solid #22305f}</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:#0e1738;z-index:10">
<div style="background:#facc15;color:black;padding:5px 14px;border-radius:8px;font-weight:900;font-size:13px">TOPUP GAME</div>
<div style="display:flex;gap:8px;align-items:center"><div style="background:#19244a;padding:5px 10px;border-radius:20px;font-size:11px;border:1px solid #22305f">EN / MYR</div><div style="font-size:18px">☰</div></div>
</header>
<div style="padding:16px">
<div style="background:linear-gradient(90deg,#7c3aed,#facc15);border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center">
<div><div style="font-weight:900">BONUS 100% 🔥</div><div style="font-size:11px;opacity:.9">Topup ML Hari Ini</div></div><div style="font-size:28px">🎁</div>
</div>
<input id="search" oninput="doFilter()" placeholder="Search Game or Voucher" style="width:100%;margin-top:14px;background:#19244a;border:1px solid #22305f;border-radius:12px;padding:10px 14px;color:white;outline:none">
<div style="display:flex;gap:8px;margin-top:12px;overflow:auto">
<button class="cat active" style="background:#facc15;color:black;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap">Top Up Games</button>
<button style="background:#19244a;padding:6px 12px;border-radius:20px;font-size:11px;border:1px solid #22305f">Voucher</button>
<button style="background:#19244a;padding:6px 12px;border-radius:20px;font-size:11px;border:1px solid #22305f">Entertainment</button>
<button style="background:#19244a;padding:6px 12px;border-radius:20px;font-size:11px;border:1px solid #22305f">Pulsa & PLN</button>
</div>
<div style="display:flex;justify-content:space-between;margin-top:16px"><b style="font-size:12px">POPULER 🔥</b><span style="font-size:11px;color:#facc15">Lihat Semua ></span></div>
<div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px"></div>
<div style="margin-top:20px"><b style="font-size:12px">NEW GAMES ✨</b></div>
<div id="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px"></div>
</div>
<script>
const games=[
{n:'Mobile Legends', img:'mlbb.png', price:'RM 1.43', bg:'#1e40af'},
{n:'Free Fire', img:'ff.png', price:'RM 0.29', bg:'#111827'},
{n:'PUBG Mobile', img:'pubg.png', price:'RM 2.00', bg:'#854d0e'},
{n:'Valorant', img:'valorant.png', price:'RM 2.86', bg:'#7f1d1d'},
{n:'ROBLOX', img:'roblox.png', price:'RM 3.43', bg:'#475569'},
{n:'Genshin Impact', img:'genshin.png', price:'RM 4.29', bg:'#1e3a8a'},
{n:'Honkai Star Rail', img:'honkai.png', price:'RM 4.29', bg:'#5b21b6'},
{n:'Clash of Clans', img:'coc.png', price:'RM 2.50', bg:'#a16207'},
{n:'CODM', img:'codm.png', price:'RM 3.00', bg:'#1a1a1a'},
];
function render(list){
let g=document.getElementById('grid');let g2=document.getElementById('grid2');g.innerHTML='';g2.innerHTML='';
list.forEach((x,i)=>{
let html=`<div class="card">
<div style="background:${x.bg};height:92px;display:flex;align-items:center;justify-content:center">
<img src="${x.img}" style="width:62px;height:62px;object-fit:contain;background:white;border-radius:12px;padding:4px">
</div>
<div style="padding:10px"><div style="font-size:11px;font-weight:700">${x.n}</div><div style="font-size:11px;color:#facc15;font-weight:900;margin-top:2px">${x.price}</div></div>
</div>`;
if(i<6){g.innerHTML+=html}else{g2.innerHTML+=html}
});
}
function doFilter(){
let q=document.getElementById('search').value.toLowerCase();
render(games.filter(x=>x.n.toLowerCase().includes(q)));
}
render(games);
</script>
</body>
</html>
