<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPUP GAME</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:#0b122e}
.app{max-width:1280px;margin:0 auto;background:#0f1a3d;min-height:100vh}
.header{position:sticky;top:0;z-index:20;background:#0f1a3d;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1e2a5a}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-box img{width:40px;height:40px;background:transparent;border-radius:0;padding:0;object-fit:contain;display:block}
.banner-wrap{padding:16px}
.banner{width:100%;height:auto;aspect-ratio:3.2/1;border-radius:20px;object-fit:cover;object-position:center;display:block;border:none}
.search{margin:0 16px;background:#172250;border:1px solid #24346a;border-radius:14px;display:flex;align-items:center;padding:0 14px}
.search input{flex:1;background:transparent;border:none;color:white;padding:13px 8px;outline:none;font-size:13px}
.cat{margin:14px 16px;display:flex;gap:8px;overflow:auto;white-space:nowrap;padding-bottom:4px}
.cat div{padding:8px 16px;border-radius:20px;font-size:11px;font-weight:800;border:1px solid #24346a;cursor:pointer}
.cat .active{background:#ffcd00;color:black;border-color:#ffcd00}
.section-title{padding:20px 16px 0;display:flex;justify-content:space-between;align-items:center;color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)} .banner{height:260px}}
.card{background:#18234f;border:1px solid #24346a;border-radius:18px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);border-color:#ffcd00}
.card-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#0b122e}
.card-name{padding:10px;text-align:center;color:white;font-size:11px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-drawer{position:fixed;top:0;right:-100%;width:300px;height:100%;background:#0f1a3d;z-index:100;transition:.35s;padding:24px;border-left:1px solid #24346a}
.menu-drawer.open{right:0}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:90}
.dim.open{display:block}
</style>
</head>
<body>
<div class="dim" id="dim" onclick="toggleMenu()"></div>
<div class="menu-drawer" id="drawer">
<div style="display:flex;justify-content:space-between;color:white"><b>MENU</b><span onclick="toggleMenu()" style="cursor:pointer;font-size:22px">✕</span></div>
<div style="margin-top:20px;display:grid;gap:10px">
<div style="background:#18234f;padding:14px;border-radius:12px;color:white">🏠 Beranda</div>
<div style="background:#18234f;padding:14px;border-radius:12px;color:white">🔍 Lacak Pesanan</div>
<div style="background:#18234f;padding:14px;border-radius:12px;color:white">💬 Customer Service</div>
</div>
</div>

<div class="app">
<div class="header">
<div class="logo-box">
<img src="logo.png" onerror="this.src='mlbb.png'">
<div style="background:#ffcd00;color:black;padding:6px 14px;border-radius:9px;font-weight:900;font-size:14px;letter-spacing:.3px">TOPUP GAME</div>
</div>
  <div style="display:flex;align-items:center;gap:12px">
<div style="background:#18234f;border:1px solid #24346a;color:white;padding:6px 12px;border-radius:20px;font-size:11px">EN / MYR</div>
<div onclick="toggleMenu()" style="color:white;font-size:26px;cursor:pointer">☰</div>
</div>
</div>
  
  <!-- MULAI BANNER SLIDER - TARUH DISINI -->
<div style="padding:16px">
  <div style="position:relative;overflow:hidden;border-radius:20px">
    <div id="slider" style="display:flex;transition:transform 0.5s ease">
      <img src="./banner.png" style="width:100%;flex-shrink:0;aspect-ratio:3.4/1;object-fit:cover;display:block">
      <img src="./banner2.png" style="width:100%;flex-shrink:0;aspect-ratio:3.4/1;object-fit:cover;display:block">
    </div>
    <!-- titik kuning -->
    <div style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px">
      <div id="dot0" style="width:20px;height:6px;border-radius:10px;background:#ffcd00"></div>
      <div id="dot1" style="width:6px;height:6px;border-radius:10px;background:rgba(255,255,255,.4)"></div>
    </div>
  </div>
</div>
<!-- SELESAI BANNER -->

<div class="banner-wrap">
</div>

<div class="search">
<span style="color:#6b7db8">🔍</span>
<input id="q" oninput="doSearch()" placeholder="Cari game atau voucher...">
</div>

<div class="cat">
<div class="active">Semua Game</div>
<div style="color:#8fa0d0;background:#18234f">Top Up</div>
<div style="color:#8fa0d0;background:#18234f">Voucher</div>
<div style="color:#8fa0d0;background:#18234f">Pulsa</div>
<div style="color:#8fa0d0;background:#18234f">E-Wallet</div>
</div>

<div class="section-title"><b style="font-size:13px">POPULER 🔥</b><span style="font-size:11px;color:#ffcd00">Lihat Semua ›</span></div>
<div id="pop" class="grid"></div>

<div class="section-title"><b style="font-size:13px">NEW RELEASE ✨</b></div>
<div id="new" class="grid" style="padding-bottom:90px"></div>
</div>

<script>
function toggleMenu(){document.getElementById('drawer').classList.toggle('open');document.getElementById('dim').classList.toggle('open')}


const games=[
{n:'Mobile Legends', img:'mlbb.png'},
{n:'Free Fire', img:'ff.png'},
{n:'PUBG Mobile', img:'pubg.png'},
{n:'Valorant', img:'valorant.png'},
{n:'ROBLOX', img:'roblox.png'},
{n:'Genshin Impact', img:'genshin.png'},
{n:'Honkai Star Rail', img:'honkai.png'},
{n:'Clash of Clans', img:'coc.png'},
{n:'Call of Duty Mobile', img:'codm.png'},
];

function render(list){
let p=document.getElementById('pop');let n=document.getElementById('new');p.innerHTML='';n.innerHTML='';
list.forEach((g,i)=>{
let h=`<div class="card"><img src="${g.img}" class="card-img" loading="lazy" onerror="this.src='logo.png'"><div class="card-name">${g.n}</div></div>`;
if(i<6) p.innerHTML+=h; else n.innerHTML+=h;
});
}
function doSearch(){let v=document.getElementById('q').value.toLowerCase(); render(games.filter(x=>x.n.toLowerCase().includes(v))) }
render(games);
// SLIDER BANNER
let cur = 0;
const s = document.getElementById('slider');
function show(n){
  s.style.transform = `translateX(-${n*100}%)`;
  document.getElementById('dot0').style.background = n==0 ? '#ffcd00' : 'rgba(255,255,255,.4)';
  document.getElementById('dot0').style.width = n==0 ? '20px' : '6px';
  document.getElementById('dot1').style.background = n==1 ? '#ffcd00' : 'rgba(255,255,255,.4)';
  document.getElementById('dot1').style.width = n==1 ? '20px' : '6px';
}
setInterval(()=>{ cur = (cur+1)%2; show(cur); }, 3500);
</script>
</body>
</html>
